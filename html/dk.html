<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="../css/dk.css">
</head>

<body>

  <div class="login-page">
    <div class="form">
      <form class="register-form">
   
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email address" required />
        <input type="password" id="password" placeholder="Password" required />
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />

        <button type="submit" style="color: white;">Create Account</button>

        <p class="message" style="color: red;">
          Already have an account? <a href="dkdn.html">Log In</a>
        </p>
        <p class="message" style="color: red;">
          Forgot password? <a href="quenpass.html">Reset password here</a>
        </p>
      </form>
    </div>
  </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <!-- Firebase Auth -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-auth-compat.min.js"
        integrity="sha512-b2PGOE6ClpdFR5WZylPqJ9NEtHyGtdXKIe5wI0qRKVg3VeH9Km8CvihpnySwf6v21TV2cMTUp/BuglUiFLB38Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../js/firebase-config.js"></script>
<script src="../js/dk.js"></script>
<script src="../js/navbar.js"></script>
</body>

</html>
