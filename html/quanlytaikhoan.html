                <form class="d-flex" role="search"> <input class="form-control me-2" type="search" placeholder="Search"
                        aria-label="Search" /> <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>

    <section class="crud-container">

        <div class="crud-card">
            <h2>Sửa thông tin tài khoản</h2>
            <p id="hint">Bấm nút "Sửa" ở bảng bên dưới để chọn 1 tài khoản.</p>

            <div class="form-row">
                <label>Email (không sửa được)</label>
                <input id="email" class="form-control" readonly>
            </div>

            <div class="form-row">
                <label>Username</label>
                <input id="username" class="form-control">
            </div>

            <div class="form-row">
                <label>Họ và tên</label>
                <input id="fullName" class="form-control">
            </div>

            <div class="form-row">
                <label>Số điện thoại</label>
                <input id="phone" class="form-control">
            </div>

            <div class="form-row">
                <label>Địa chỉ</label>
                <input id="address" class="form-control">
            </div>

            <div class="form-row">
                <label>Quyền</label>
                <select id="role" class="form-select">
                    <option value="1">Admin</option>
                    <option value="2">Khách hàng</option>
                </select>
            </div>

            <div class="form-buttons">
                <button class="btn btn-primary" onclick="saveUser()">Lưu thay đổi</button>
                <button class="btn btn-secondary" onclick="clearForm()">Huỷ</button>
            </div>
        </div>

        <div class="crud-card">
            <h2>Danh sách tài khoản</h2>

            <table class="product-table">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Họ và tên</th>
                        <th>Số điện thoại</th>
                        <th>Địa chỉ</th>
                        <th>Quyền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                </tbody>
            </table>
        </div>

    </section>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
